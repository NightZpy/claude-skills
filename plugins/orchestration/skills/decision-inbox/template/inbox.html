<title>Buzón de decisiones</title>
<!-- Template from the decision-inbox skill. Project-specific values live in the db doc meta/config,
     not here: {project, repo_url, sections:[[key,label],...]}. Replace the :root token block with the
     project's own artifact design system if it has one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Default tokens: fixed light theme, every surface declares its ground AND its ink.
   Swap this block for the project's own tokens when it has an artifact design system. */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  color-scheme:light;
  --ground:#ECEEF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --sunk:#E0E4EA;
  --ink:#12151A; --ink-2:#5A6573; --ink-3:#8B95A2;
  --line:#CFD6DE; --line-strong:#A9B3BF;
  --signal:#9C6A05; --signal-soft:#F7E9C9;
  --tpl:#1F5A87; --tpl-soft:#DBE9F3;
  --dsl:#456E22; --dsl-soft:#E0EDD2;
  --alert:#8E2F1C; --alert-soft:#F8DFD8;
}
html{background:var(--ground); color:var(--ink)}
*{box-sizing:border-box}
html body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:920px; margin:0 auto; padding:0 16px 96px}

.hero{padding:44px 0 22px}
.kicker{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--signal); margin:0 0 14px}
h1{font-weight:800; font-size:clamp(36px,8vw,64px); line-height:.98; letter-spacing:-.035em; margin:0 0 14px; text-wrap:balance}
.hero p{color:var(--ink-2); margin:0; max-width:52ch}

.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ground); padding:10px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); margin-bottom:22px}
.tab{font:600 14px Archivo,sans-serif; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.tab .n{font-family:"JetBrains Mono",monospace; font-size:12px; margin-left:6px; opacity:.75}
.status-line{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3)}

.card{margin:0 0 20px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.card.answered{border-color:var(--dsl)}
.card.processed{opacity:.72}
.top{padding:24px 24px 6px}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:0 0 12px}
.q{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--signal)}
.chip{font-family:"JetBrains Mono",monospace; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink-2); background:var(--surface-2)}
.chip.open{border-color:var(--signal); color:var(--signal); background:var(--signal-soft)}
.chip.answered{border-color:var(--dsl); color:var(--dsl); background:var(--dsl-soft)}
.chip.processed{border-color:var(--tpl); color:var(--tpl); background:var(--tpl-soft)}
.chip.blind{border-color:var(--alert); color:var(--alert); background:var(--alert-soft)}
h2{font-weight:800; font-size:clamp(22px,4vw,30px); line-height:1.1; letter-spacing:-.022em; margin:0 0 12px; text-wrap:balance}
.ctx{color:var(--ink-2); white-space:pre-wrap; margin:0 0 12px; max-width:68ch; font-size:16px}
.question{font-weight:600; margin:0 0 6px; max-width:62ch}

.media{display:grid; gap:12px; padding:10px 24px 6px; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.m{margin:0; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px}
.m figcaption{font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700; color:var(--ink); margin:0 0 8px}
.m img{display:block; width:100%; height:auto; border-radius:4px; cursor:zoom-in; background:var(--sunk)}
.m video{display:block; width:100%; max-height:70vh; border-radius:4px; background:#000}
.m audio{display:block; width:100%}
.m.missing{color:var(--alert); font-size:14px}

.answer-box{padding:14px 24px 22px; display:grid; gap:12px}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; padding:12px 14px; border-radius:8px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); font:inherit; cursor:pointer}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-checked="true"]{border-color:var(--tpl); background:var(--tpl-soft)}
.opt .dot{flex:none; width:18px; height:18px; margin-top:3px; border-radius:50%; border:2px solid var(--line-strong); background:var(--surface)}
.opt.multi .dot{border-radius:4px}
.opt.multi[aria-checked="true"] .dot{background:var(--tpl); box-shadow:inset 0 0 0 3px var(--surface)}
.opt[aria-checked="true"] .dot{border-color:var(--tpl); background:radial-gradient(circle,var(--tpl) 45%,var(--surface) 50%)}
.opt b{display:block; font-weight:600}
.opt small{display:block; color:var(--ink-2); font-size:14px; line-height:1.4; margin-top:2px}
label.lbl{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
textarea{width:100%; min-height:84px; resize:vertical; font:16px/1.45 Archivo,sans-serif; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink)}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:600 15px Archivo,sans-serif; padding:10px 16px; border-radius:8px; border:1.5px solid var(--ink); background:var(--ink); color:var(--surface); cursor:pointer}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.note{font-size:14px; color:var(--ink-2)}
.note.err{color:var(--alert)}
.note.ok{color:var(--dsl)}

.given{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--dsl-soft); color:var(--ink); border:1px solid var(--dsl)}
.given .lbl{color:var(--dsl)}
.given p{margin:4px 0 0}
.reveal{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--signal-soft); color:var(--ink); border:1px solid var(--signal); white-space:pre-wrap}
.ref{display:block; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-3); padding:0 24px 18px; word-break:break-all}

.empty{background:var(--surface); color:var(--ink-2); border:1px dashed var(--line-strong); border-radius:10px; padding:28px; text-align:center}
.warn{background:var(--alert-soft); color:var(--ink); border:1px solid var(--alert); border-radius:10px; padding:16px 18px; margin-bottom:20px}

.lb{position:fixed; inset:0; z-index:20; background:#12151A; color:#fff; display:grid; grid-template-rows:auto 1fr auto; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-head{display:flex; align-items:center; gap:10px; padding:10px 14px; font-family:"JetBrains Mono",monospace; font-size:13px}
.lb-head .cnt{color:#A9B3BF}
.lb-head .x{margin-left:auto}
.lb-btn{font:600 14px Archivo,sans-serif; padding:8px 12px; border-radius:8px; border:1px solid #5A6573; background:transparent; color:#fff; cursor:pointer}
.lb-btn:disabled{opacity:.35; cursor:default}
.lb-stage{min-height:0; display:grid; gap:8px; padding:0 10px; grid-auto-flow:column; grid-auto-columns:1fr}
.lb-stage.duo{grid-auto-flow:row; grid-auto-rows:1fr}
@media (min-aspect-ratio:4/3){ .lb-stage.duo{grid-auto-flow:column; grid-auto-columns:1fr; grid-auto-rows:auto} }
.lb-pane{min-height:0; min-width:0; display:grid; grid-template-rows:auto 1fr; gap:4px}
.lb-pane span{font-family:"JetBrains Mono",monospace; font-size:12px; color:#CFD6DE}
.lb-pane img{width:100%; height:100%; min-height:0; object-fit:contain}
.lb-foot{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; padding:10px 14px}
.lb-foot .rate{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.lb .seg{border-color:#5A6573; background:transparent; color:#fff}
.lb .seg[aria-pressed="true"]{background:#fff; color:#12151A; border-color:#fff}
.lb-q{width:100%; text-align:center; font-size:14px; color:#CFD6DE}

.cmp{padding:10px 24px 6px; display:grid; gap:14px}
.refs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px; color:var(--ink-2)}
.pair{background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; gap:10px}
.pair.rated{border-color:var(--dsl)}
.pair-imgs{display:grid; gap:8px; grid-template-columns:1fr 1fr}
@media (max-width:640px){ .pair-imgs{grid-template-columns:1fr} }
.pair figure{margin:0; display:grid; gap:4px; align-content:start}
.pair figcaption{font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700}
.pair figcaption.ref{color:var(--ink-3); font-weight:400}
.pair img{display:block; width:100%; height:auto; border-radius:4px; cursor:zoom-in; background:var(--sunk)}
.rate{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.rate .lbl{margin-right:4px}
.seg{font:600 14px Archivo,sans-serif; padding:7px 12px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer}
.seg[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.ratesum{font-size:14px; color:var(--ink-2)}
@media (max-width:560px){ .cmp{padding-left:16px; padding-right:16px} }
.resolution{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--dsl-soft); color:var(--ink); border:1px solid var(--dsl)}
.agentnote{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--tpl-soft); color:var(--ink); border:1px solid var(--tpl)}
.resolution .lbl{color:var(--dsl)} .agentnote .lbl{color:var(--tpl)}
.resolution p, .agentnote p{margin:4px 0 0; white-space:pre-wrap}
.chip.waiting{border-color:var(--tpl); color:var(--tpl); background:var(--tpl-soft)}
.chip.unsent{border-color:var(--alert); color:var(--alert); background:var(--alert-soft)}
.bulk{display:flex; flex-wrap:wrap; gap:8px; align-items:center; width:100%; margin-top:6px}
.bulk .note{margin:0}
@media (max-width:560px){ .resolution,.agentnote{margin-left:16px; margin-right:16px} }

footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3); line-height:1.9}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){ .top,.answer-box{padding-left:16px;padding-right:16px} .media{padding-left:16px;padding-right:16px} .given,.reveal{margin-left:16px;margin-right:16px} .ref{padding-left:16px;padding-right:16px} }

/* v2: gallery, sections, issue box, related */
.bar2{display:flex; gap:6px; flex-wrap:wrap; margin:-10px 0 18px}
.sec{font:600 13px Archivo,sans-serif; padding:6px 11px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.sec[aria-pressed="true"]{border-color:var(--signal); background:var(--signal-soft); color:var(--ink)}
.sec .n{font-family:"JetBrains Mono",monospace; font-size:11px; margin-left:5px}
.progress{display:flex; align-items:center; gap:10px; margin:0 0 12px; font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink-2)}
.progress .track{flex:1; height:4px; background:var(--sunk); border-radius:2px; overflow:hidden}
.progress .fill{height:100%; background:var(--dsl)}
.nav{display:flex; gap:8px; justify-content:space-between; margin:-6px 0 22px}
.queue{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.queue h3{margin:0; padding:14px 18px 10px; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:400}
.row{display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:12px 18px; border:0; border-top:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .t{flex:1; min-width:0; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .k{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3); flex:none}
.row.done .t{color:var(--ink-3); text-decoration:line-through; font-weight:400}
.issue{margin:0 0 14px; padding:12px 14px; border-radius:8px; background:var(--tpl-soft); color:var(--ink); border:1px solid var(--tpl); max-width:68ch}
.issue .h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.issue .num{font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--tpl); font-size:13px}
.issue .ti{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink-2); word-break:break-word}
.issue p{margin:6px 0 0; font-size:15px}
.issue a{display:inline-block; margin-top:6px; color:var(--tpl); font-weight:600; font-size:14px}
.rel{margin:0 24px 16px; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.rel .row{padding:10px 14px}
.rel .row:first-child{border-top:0}
@media (max-width:560px){ .rel{margin-left:16px;margin-right:16px} .row{padding-left:14px;padding-right:14px} }
</style>

<div class="wrap">
  <header class="hero">
    <p class="kicker" id="kicker" data-t="kicker">Lo que espera tu respuesta</p>
    <h1 data-t="title">Buzón de decisiones</h1>
    <p data-t="intro"></p>
  </header>

  <div class="bar" role="toolbar" data-t-aria="view">
    <button class="tab" data-f="open" aria-pressed="true"><span data-t="tab_open"></span><span class="n" id="n-open">–</span></button>
    <button class="tab" data-f="answered" aria-pressed="false"><span data-t="tab_answered"></span><span class="n" id="n-answered">–</span></button>
    <button class="tab" data-f="all" aria-pressed="false"><span data-t="tab_all"></span><span class="n" id="n-all">–</span></button>
    <span class="status-line" id="live" data-t="connecting"></span>
  </div>
  <div class="bar2" id="sections" role="toolbar" data-t-aria="importance"></div>

  <div id="warn" class="warn" hidden></div>
  <main id="list"><div class="empty" data-t="loading"></div></main>

  <footer>
    <span data-t="footer_states"></span><br>
    <span data-t="footer_blind"></span>
  </footer>
</div>

  if (filter !== "open") { box.hidden = true; return; }
  box.hidden = false;
  const btn = (k, label, n) => el("button", {class:"sec", type:"button", "aria-pressed": String(section === k), onclick: () => { section = k; currentId = null; render(); }}, label, el("span", {class:"n"}, n));
  box.replaceChildren(btn("all", t("follow_all"), pool.length),
    ...sections().map(([k, l]) => [k, l, pool.filter(i => i.section === k).length]).filter(x => x[2]).map(x => btn(...x)));
}

function renderFollow(box) {
  box.hidden = false;
  const done = items.filter(i => st(i) !== "open");
  const unsent = done.filter(i => followOf(i) === "unsent"), waiting = done.filter(i => followOf(i) === "waiting");
  const btn = k => el("button", {class:"sec", type:"button", "aria-pressed": String(follow === k), onclick: () => { follow = k; render(); }},
    t("follow_" + k), el("span", {class:"n"}, k === "all" ? done.length : done.filter(i => followOf(i) === k).length));
  box.replaceChildren(...FOLLOW.map(btn), el("div", {class:"bulk"},
    el("button", {class:"btn", type:"button", disabled: !comments || !unsent.length, onclick: () => notifyMany(unsent, "notify")},
      unsent.length ? t("bulk_notify", {n: unsent.length}) : t("nothing_unsent")),
    el("button", {class:"btn ghost", type:"button", disabled: !comments || !waiting.length, onclick: () => notifyMany(waiting, "status")},
      waiting.length ? t("bulk_status", {n: waiting.length}) : t("none_waiting")),
    bulkNote ? el("p", {class:"note " + bulkNote.cls, role:"status"}, bulkNote.msg) : null));
}

function render() {
  const count = s => items.filter(i => st(i) === s).length;
  $("#n-open").textContent = count("open");
  $("#n-answered").textContent = count("answered") + count("processed");
  $("#n-all").textContent = items.length;
  const list = $("#list");
  const focusId = document.activeElement?.id, sel = document.activeElement?.selectionStart;
  let view;

  if (filter === "open") {
    const open = items.filter(i => st(i) === "open").sort(order);
    renderSections(open);
    const pool = section === "all" ? open : open.filter(i => i.section === section);
    if (!pool.length) {
      view = [el("div", {class:"empty"}, open.length ? t("empty_section") : t("empty_all"))];
    } else {
      if (!pool.some(i => i.id === currentId)) currentId = pool[0].id;
      const idx = pool.findIndex(i => i.id === currentId), cur = pool[idx];
      const doneAll = items.length - open.length;
      view = [
        el("div", {class:"progress"}, el("span", {}, t("i_of_n", {i: idx + 1, n: pool.length})),
          el("span", {class:"track"}, el("span", {class:"fill", style:`width:${items.length ? Math.round(100 * doneAll / items.length) : 0}%`})),
          el("span", {}, t("answered_n", {done: doneAll, n: items.length}))),
        card(cur),
        el("div", {class:"nav"},
          el("button", {class:"btn ghost", type:"button", disabled: idx === 0, onclick: () => { currentId = pool[idx - 1].id; render(); scrollTop(); }}, t("prev_arrow")),
          el("button", {class:"btn ghost", type:"button", disabled: idx === pool.length - 1, onclick: () => { currentId = pool[idx + 1].id; render(); scrollTop(); }}, t("next_arrow"))),
        pool.length > 1 ? el("div", {class:"queue"}, el("h3", {}, t("queue")),
          pool.filter(i => i.id !== cur.id).map(o => rowFor(o, o2 => { currentId = o2.id; render(); scrollTop(); }))) : null,
      ];
    }
  } else {
    renderSections([]);
    const shown = items.filter(i => filter === "all" || (st(i) !== "open" && (follow === "all" || followOf(i) === follow)))
      .sort((a, b) => (st(a) === "open") - (st(b) === "open") || order(a, b));
    view = shown.length ? shown.map(card) : [el("div", {class:"empty"}, t("empty_view"))];
  }
  list.replaceChildren(...view.filter(Boolean));
  if (lb) renderLB();   // the open lightbox follows live data (ratings, reference choice)
  if (focusId) { const f = document.getElementById(focusId); if (f) { f.focus(); if (sel != null && f.setSelectionRange) f.setSelectionRange(sel, sel); } }
}
function scrollTop() { requestAnimationFrame(() => $("#list").scrollIntoView({block:"start"})); }

async function save(it, alsoNotify) {
  const d = drafts[it.id];
  const text = (d.text || "").trim();
  const ratings = Object.fromEntries(Object.entries(ratingsOf(it)).filter(([, v]) => v));
  const ids = d.option_ids;
  if (it.multi && ids.length && it.min && ids.length < it.min) { notes[it.id] = {cls:"err", msg: t("min_err", {n: it.min})}; return render(); }
  if (!ids.length && !text && !Object.keys(ratings).length) { notes[it.id] = {cls:"err", msg: t("need_answer")}; return render(); }
  notes[it.id] = {cls:"", msg: t("saving")}; render();
  const answer = {option_id: it.multi ? null : ids[0] || null, option_ids: ids, text, ratings, answered_at: new Date().toISOString()};
  try {
    await db.doc("items/" + it.id).update({status:"answered", answer, resolution:null, agent_note:null, notified_at:null, status_asked_at:null});
    d.editing = false;
    notes[it.id] = {cls:"ok", msg: t("saved")};
  } catch (e) {
    notes[it.id] = {cls:"err", msg: e?.code === "invalid_argument" ? t("no_perm") : t("save_fail", {code: e?.code || "error"})};
    return render();
  }
  if (alsoNotify) await notify({...it, answer});
  else render();
}

// Posts one comment and, when this viewer can, sends it to the Claude session watching the page.
async function postToClaude(anchorEl, text) {
  const anchor = await comments.anchorFor(anchorEl);
  let how = "";
  try { how = await comments.canSendToClaude(); } catch { how = "off"; }
  if (how === "available") { await comments.sendToClaude({anchor, text}); return {cls:"ok", msg: t("sent_claude")}; }
  await comments.create({anchor, text});
  const why = t({writers_only:"why_writers", no_session:"why_nosession", off:"why_off"}[how] || "why_default");
  return {cls:"", msg: t("posted_not_sent", {why})};
}
const failMsg = e => { const k = {consent_required:"fail_consent", forbidden:"fail_forbidden", rate_limited:"fail_rate", claude_unavailable:"fail_claude"}[e?.code]; return k ? t(k) : t("fail_generic", {code: e?.code || "error"}); };
function answerLine(it) {
  const picked = (it.options || []).filter(o => chosenIds(it.answer).includes(o.id)).map(o => o.label);
  return [picked.length ? (picked.length > 1 ? "options: " : "option: ") + picked.join(", ") : null, ratingLine(it) ? "ratings: " + ratingLine(it) : null, it.answer?.text ? "comment: " + it.answer.text : null].filter(Boolean).join(" · ");
}

async function notify(it) {
  const n = issueNo(it);
  const text = [`[decision-inbox] Answered: «${it.title}» (id ${it.id}${n ? ", #" + n : ""}${it.source_agent ? ", from " + it.source_agent : ""}).`,
    answerLine(it), "Read it with ArtifactData (collection items, status == answered). When done, write resolution {text, at, by} and set status processed."].filter(Boolean).join("\n").slice(0, 3900);
  const keep = notes[it.id]?.cls === "ok" ? t("saved") + " " : "";
  notes[it.id] = {cls:"", msg: keep + t("sending_notice")}; render();
  try {
    const r = await postToClaude(document.getElementById("item-" + it.id) || document.querySelector("main"), text);
    notes[it.id] = {cls: r.cls, msg: keep + r.msg};
    try { await db.doc("items/" + it.id).update({notified_at: new Date().toISOString()}); } catch {}
  } catch (e) { notes[it.id] = {cls:"err", msg: keep + failMsg(e)}; }
  render();
}

async function askStatus(it) {
  const text = `[decision-inbox] Status requested for 1 answer already sent and unresolved. Write agent_note {text, at, by} with where it stands, or resolution {text, at, by} and status processed if done.\n- ${it.id}: «${it.title}»${it.source_agent ? " (from " + it.source_agent + ")" : ""}`;
  notes[it.id] = {cls:"", msg: t("asking")}; render();
  try {
    const r = await postToClaude(document.getElementById("item-" + it.id) || document.querySelector("main"), text);
    notes[it.id] = r;
    try { await db.doc("items/" + it.id).update({status_asked_at: new Date().toISOString()}); } catch {}
  } catch (e) { notes[it.id] = {cls:"err", msg: failMsg(e)}; }
  render();
}

// One comment for many items: "notify" tells the agent about answers it has not seen;
// "status" asks for the state of answers it was told about but has not resolved.
async function notifyMany(list, kind) {
  if (!list.length) return;
  const head = kind === "notify"
    ? `[decision-inbox] ${list.length} answer(s) not sent yet. Read them with ArtifactData (items, status == answered), act, and write resolution {text, at, by} and status processed on each.`
    : `[decision-inbox] Status requested for ${list.length} answer(s) already sent and unresolved. On each, write agent_note {text, at, by} with where it stands, or resolution {text, at, by} and status processed if done.`;
  let body = "", shown = 0;
  for (const it of list) {
    const line = `\n- ${it.id}: «${it.title}»${it.source_agent ? " (from " + it.source_agent + ")" : ""}` + (kind === "notify" && answerLine(it) ? " → " + answerLine(it) : "");
    if ((head + body + line).length > 3800) { body += `\n… and ${list.length - shown} more (see the collection).`; break; }
    body += line; shown++;
  }
  bulkNote = {cls:"", msg: t("sending")}; render();
  try {
    const r = await postToClaude($("#sections"), head + body);
    const field = kind === "notify" ? "notified_at" : "status_asked_at", now = new Date().toISOString();
    for (const it of list) { try { await db.doc("items/" + it.id).update({[field]: now}); } catch {} }
    bulkNote = r;
  } catch (e) { bulkNote = {cls:"err", msg: failMsg(e)}; }
  render();
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; syncTabs(); render(); }));

(async () => {
  const claude = window.claude;
  if (!claude?.use) { applyStatic(); $("#live").textContent = t("offline"); $("#list").replaceChildren(el("div", {class:"empty"}, t("no_view"))); return; }
  applyStatic();
  [db, comments] = await Promise.all([claude.use("db"), claude.use("comments").catch(() => null)]);
  if (!db) { $("#live").textContent = t("no_db"); $("#list").replaceChildren(el("div", {class:"empty"}, t("no_db_msg"))); return; }
  const fail = e => { $("#live").textContent = t("disconnected"); const w = $("#warn"); w.hidden = false; w.textContent = t("lost", {code: e?.code || "error"}); };
  db.doc("meta/config").onSnapshot(snap => {
    const c = snap.data() || {};
    if (c.lang) LANG = String(c.lang);
    STRINGS = c.strings && typeof c.strings === "object" ? c.strings : {};
    if (Array.isArray(c.sections) && c.sections.length) { CUSTOM_SECTIONS = c.sections; SEC_RANK = Object.fromEntries(c.sections.map(([k], i) => [k, i])); }
    if (c.repo_url) REPO = c.repo_url;
    applyStatic();
    if (c.project) $("#kicker").textContent = t("kicker_project", {project: c.project});
    render();
  }, fail);
  db.collection("issues").onSnapshot(snap => { issues = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, fail);
  db.collection("items").onSnapshot(snap => {
    items = snap.docs.map(d => ({...d.data(), id: d.id}));
    $("#live").textContent = t("live", {time: new Date().toLocaleTimeString(LANG, {hour:"2-digit", minute:"2-digit"})});
    render();
  }, fail);
})();
</script>

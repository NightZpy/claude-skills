<title>Decision inbox</title>
<!-- Template from the decision-inbox skill. Project-specific values live in the db doc meta/config,
     not here: {project, repo_url, projects:[{id,label,repo_url,goal}], lang, strings, sections:[[key,label],...]}. Replace the :root token block with the
     project's own artifact design system if it has one. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
/* Default tokens: fixed light theme, every surface declares its ground AND its ink.
   Swap this block for the project's own tokens when it has an artifact design system. */
:root, :root[data-theme="dark"], :root[data-theme="light"]{
  color-scheme:light;
  --ground:#ECEEF1; --surface:#FFFFFF; --surface-2:#F3F5F8; --sunk:#E0E4EA;
  --ink:#12151A; --ink-2:#5A6573; --ink-3:#8B95A2;
  --line:#CFD6DE; --line-strong:#A9B3BF;
  --signal:#9C6A05; --signal-soft:#F7E9C9;
  --tpl:#1F5A87; --tpl-soft:#DBE9F3;
  --dsl:#456E22; --dsl-soft:#E0EDD2;
  --alert:#8E2F1C; --alert-soft:#F8DFD8;
}
html{background:var(--ground); color:var(--ink)}
*{box-sizing:border-box}
html body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:Archivo,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
.wrap{max-width:920px; margin:0 auto; padding:0 16px 96px}

.hero{padding:44px 0 22px}
.kicker{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.2em; text-transform:uppercase; color:var(--signal); margin:0 0 14px}
h1{font-weight:800; font-size:clamp(36px,8vw,64px); line-height:.98; letter-spacing:-.035em; margin:0 0 14px; text-wrap:balance}
.hero p{color:var(--ink-2); margin:0; max-width:52ch}

.bar{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--ground); padding:10px 0; display:flex; gap:8px; flex-wrap:wrap; align-items:center; border-bottom:1px solid var(--line); margin-bottom:22px}
.tab{font:600 14px Archivo,sans-serif; padding:8px 14px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer}
.tab[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.tab .n{font-family:"JetBrains Mono",monospace; font-size:12px; margin-left:6px; opacity:.75}
/* Queue jump: always in the sticky bar; hover, focus or tap opens the list of open items. */
.qwrap{position:relative}
.qpop{display:none; position:absolute; top:calc(100% + 6px); left:0; z-index:10; width:min(440px, calc(100vw - 32px)); max-height:60vh; overflow-y:auto; box-shadow:0 10px 28px rgba(18,21,26,.18)}
.qwrap:hover .qpop, .qwrap:focus-within .qpop, .qwrap.open .qpop{display:block}
/* An invisible bridge over the 6px gap, so moving the pointer from the tab to the list keeps it open. */
.qwrap::after{content:""; position:absolute; left:0; right:0; top:100%; height:8px; display:none}
.qwrap:hover::after, .qwrap.open::after{display:block}
.qpop .row[aria-current="true"]{background:var(--tpl-soft)}
/* Replies: what agents wrote back on items. One tab in the sticky bar (only when something is unread),
   a list to jump to each item, and a conversation with a reply box on the card. */
.rtab{border-color:var(--tpl); color:var(--tpl)}
.rtab .n{opacity:1; font-weight:700}
.rtab.ping{animation:rping 1s ease-out 2}
@keyframes rping{0%{box-shadow:0 0 0 0 var(--tpl)}100%{box-shadow:0 0 0 9px transparent}}
@media (prefers-reduced-motion: reduce){ .rtab.ping{animation:none} }
.row.rrow{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:2px 10px}
.row.rrow .s{grid-column:1/-1; font-size:13px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qpop .rall{display:block; width:100%; padding:10px 18px; border:0; border-top:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); font:600 13px Archivo,sans-serif; text-align:left; cursor:pointer}
.status-line{margin-left:auto; font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3)}

.card{margin:0 0 20px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.card.answered{border-color:var(--dsl)}
.card.processed{opacity:.72}
.top{padding:24px 24px 6px}
.meta{display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center; margin:0 0 12px}
/* Origin line: when and who, first thing on every card. */
.origin{display:flex; flex-wrap:wrap; gap:4px 12px; align-items:baseline; margin:0 0 10px; font:700 15px "JetBrains Mono",monospace; color:var(--ink)}
.origin .who{color:var(--tpl)}
.origin .ans{font-weight:400; font-size:13px; color:var(--ink-2)}
.q{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--signal)}
.chip{font-family:"JetBrains Mono",monospace; font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--line-strong); color:var(--ink-2); background:var(--surface-2)}
.chip.open{border-color:var(--signal); color:var(--signal); background:var(--signal-soft)}
.chip.answered{border-color:var(--dsl); color:var(--dsl); background:var(--dsl-soft)}
.chip.processed{border-color:var(--tpl); color:var(--tpl); background:var(--tpl-soft)}
.chip.blind{border-color:var(--alert); color:var(--alert); background:var(--alert-soft)}
h2{font-weight:800; font-size:clamp(22px,4vw,30px); line-height:1.1; letter-spacing:-.022em; margin:0 0 12px; text-wrap:balance}
.ctx{color:var(--ink-2); margin:0 0 12px; max-width:68ch; font-size:16px}
/* Markdown blocks inside context / question / resolution / agent note */
.md > :first-child{margin-top:0} .md > :last-child{margin-bottom:0}
.md p{margin:0 0 10px}
.md h3, .md h4{font-weight:800; color:var(--ink); letter-spacing:-.01em; margin:16px 0 6px; line-height:1.25}
.md h3{font-size:18px} .md h4{font-size:16px}
.md ul, .md ol{margin:0 0 10px; padding-left:1.3em}
.md li{margin:2px 0}
.md li::marker{color:var(--ink-3)}
.md strong{color:var(--ink); font-weight:600}
.md code{font-family:"JetBrains Mono",monospace; font-size:.86em; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:4px; padding:0 4px}
.md pre{font-family:"JetBrains Mono",monospace; font-size:13px; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:6px; padding:10px 12px; overflow-x:auto; margin:0 0 10px}
.md blockquote{margin:0 0 10px; padding:6px 12px; border-left:3px solid var(--signal); background:var(--signal-soft); color:var(--ink)}
.md a{color:var(--tpl); font-weight:600}
.md .tbl{overflow-x:auto; margin:0 0 10px}
.md table{border-collapse:collapse; font-size:14px; font-variant-numeric:tabular-nums}
.md th, .md td{border:1px solid var(--line); padding:4px 8px; text-align:left; vertical-align:top}
.md th{background:var(--surface-2); color:var(--ink); font-weight:600}
.question{font-weight:600; margin:0 0 6px; max-width:62ch}

.media{display:grid; gap:12px; padding:10px 24px 6px; grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.m{margin:0; background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px}
.m figcaption{font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700; color:var(--ink); margin:0 0 8px}
.m img{display:block; width:100%; height:auto; border-radius:4px; cursor:zoom-in; background:var(--sunk)}
.m video{display:block; width:100%; max-height:70vh; border-radius:4px; background:#000}
.m audio{display:block; width:100%}
.m.missing{color:var(--alert); font-size:14px}

.answer-box{padding:14px 24px 22px; display:grid; gap:12px}
.opts{display:grid; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; padding:12px 14px; border-radius:8px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); font:inherit; cursor:pointer}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-checked="true"]{border-color:var(--tpl); background:var(--tpl-soft)}
.opt .dot{flex:none; width:18px; height:18px; margin-top:3px; border-radius:50%; border:2px solid var(--line-strong); background:var(--surface)}
.opt.multi .dot{border-radius:4px}
.opt.multi[aria-checked="true"] .dot{background:var(--tpl); box-shadow:inset 0 0 0 3px var(--surface)}
.opt[aria-checked="true"] .dot{border-color:var(--tpl); background:radial-gradient(circle,var(--tpl) 45%,var(--surface) 50%)}
.opt b{display:block; font-weight:600}
.opt small{display:block; color:var(--ink-2); font-size:14px; line-height:1.4; margin-top:2px}
[hidden]{display:none!important}   /* flex/grid rules must not override the hidden attribute */
.lbl{font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--ink-3)}
textarea{width:100%; min-height:84px; resize:vertical; font:16px/1.45 Archivo,sans-serif; padding:10px 12px; border-radius:8px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink)}
.actions{display:flex; flex-wrap:wrap; gap:8px; align-items:center}
.btn{font:600 15px Archivo,sans-serif; padding:10px 16px; border-radius:8px; border:1.5px solid var(--ink); background:var(--ink); color:var(--surface); cursor:pointer}
.btn.ghost{background:var(--surface); color:var(--ink); border-color:var(--line-strong)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.note{font-size:14px; color:var(--ink-2)}
.note.err{color:var(--alert)}
.note.ok{color:var(--dsl)}

.given{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--dsl-soft); color:var(--ink); border:1px solid var(--dsl)}
.given .lbl{color:var(--dsl)}
.given p{margin:4px 0 0}
.reveal{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--signal-soft); color:var(--ink); border:1px solid var(--signal); white-space:pre-wrap}
.ref{display:block; font-family:"JetBrains Mono",monospace; font-size:10.5px; color:var(--ink-3); padding:0 24px 18px; word-break:break-all}

.empty{background:var(--surface); color:var(--ink-2); border:1px dashed var(--line-strong); border-radius:10px; padding:28px; text-align:center}
.warn{background:var(--alert-soft); color:var(--ink); border:1px solid var(--alert); border-radius:10px; padding:16px 18px; margin-bottom:20px}

.lb{position:fixed; inset:0; z-index:20; background:#12151A; color:#fff; display:grid; grid-template-rows:auto 1fr auto; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.lb-head{display:flex; align-items:center; gap:10px; padding:10px 14px; font-family:"JetBrains Mono",monospace; font-size:13px}
.lb-head .cnt{color:#A9B3BF}
.lb-head .x{margin-left:auto}
.lb-btn{font:600 14px Archivo,sans-serif; padding:8px 12px; border-radius:8px; border:1px solid #5A6573; background:transparent; color:#fff; cursor:pointer}
.lb-btn:disabled{opacity:.35; cursor:default}
.lb-stage{min-height:0; display:grid; gap:8px; padding:0 10px; grid-auto-flow:column; grid-auto-columns:1fr}
.lb-stage.duo{grid-auto-flow:row; grid-auto-rows:1fr}
@media (min-aspect-ratio:4/3){ .lb-stage.duo{grid-auto-flow:column; grid-auto-columns:1fr; grid-auto-rows:auto} }
.lb-pane{min-height:0; min-width:0; display:grid; grid-template-rows:auto 1fr; gap:4px}
.lb-pane span{font-family:"JetBrains Mono",monospace; font-size:12px; color:#CFD6DE}
.lb-pane img{width:100%; height:100%; min-height:0; object-fit:contain}
.lb-foot{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; padding:10px 14px}
.lb-foot .rate{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.lb .seg{border-color:#5A6573; background:transparent; color:#fff}
.lb .seg[aria-pressed="true"]{background:#fff; color:#12151A; border-color:#fff}
.lb-q{width:100%; text-align:center; font-size:14px; color:#CFD6DE}

.cmp{padding:10px 24px 6px; display:grid; gap:14px}
.refs{display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px; color:var(--ink-2)}
.pair{background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:10px; display:grid; gap:10px}
.pair.rated{border-color:var(--dsl)}
.pair-imgs{display:grid; gap:8px; grid-template-columns:1fr 1fr}
@media (max-width:640px){ .pair-imgs{grid-template-columns:1fr} }
.pair figure{margin:0; display:grid; gap:4px; align-content:start}
.pair figcaption{font-family:"JetBrains Mono",monospace; font-size:12px; font-weight:700}
.pair figcaption.ref{color:var(--ink-3); font-weight:400}
.pair img{display:block; width:100%; height:auto; border-radius:4px; cursor:zoom-in; background:var(--sunk)}
.rate{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.rate .lbl{margin-right:4px}
.seg{font:600 14px Archivo,sans-serif; padding:7px 12px; border-radius:999px; border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer}
.seg[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.ratesum{font-size:14px; color:var(--ink-2)}
@media (max-width:560px){ .cmp{padding-left:16px; padding-right:16px} }
.resolution{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--dsl-soft); color:var(--ink); border:1px solid var(--dsl)}
.agentnote{margin:0 24px 16px; padding:14px 16px; border-radius:8px; background:var(--tpl-soft); color:var(--ink); border:1px solid var(--tpl)}
.resolution .lbl{color:var(--dsl)} .agentnote .lbl{color:var(--tpl)}
.resolution p, .agentnote p{margin:4px 0 0; white-space:pre-wrap}
.chip.waiting{border-color:var(--tpl); color:var(--tpl); background:var(--tpl-soft)}
.chip.unsent{border-color:var(--alert); color:var(--alert); background:var(--alert-soft)}
.bulk{display:flex; flex-wrap:wrap; gap:8px; align-items:center; width:100%; margin-top:6px}
.bulk .note{margin:0}
@media (max-width:560px){ .resolution,.agentnote{margin-left:16px; margin-right:16px} }
.card.fresh{border-color:var(--tpl); box-shadow:0 0 0 2px var(--tpl-soft)}
.chip.fresh{background:var(--tpl); color:var(--surface); border-color:var(--tpl)}
.conv{margin:0 24px 16px; display:flex; flex-direction:column; gap:8px}
.conv .msg{max-width:92%; padding:10px 14px; border-radius:8px; border:1px solid var(--line)}
.conv .msg.agent{align-self:flex-start; background:var(--tpl-soft); border-color:var(--tpl)}
.conv .msg.agent .lbl{color:var(--tpl)}
.conv .msg.user{align-self:flex-end; background:var(--surface-2)}
.conv .msg p{margin:4px 0 0; white-space:pre-wrap}
.conv .send{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
@media (max-width:560px){ .conv{margin-left:16px; margin-right:16px} }

footer{margin-top:40px; padding-top:18px; border-top:1px solid var(--line); font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3); line-height:1.9}
:focus-visible{outline:2px solid var(--signal); outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){ .top,.answer-box{padding-left:16px;padding-right:16px} .media{padding-left:16px;padding-right:16px} .given,.reveal{margin-left:16px;margin-right:16px} .ref{padding-left:16px;padding-right:16px} }

/* v2: gallery, sections, issue box, related */
.bar2{display:flex; gap:6px; flex-wrap:wrap; margin:-10px 0 18px}
.sec{font:600 13px Archivo,sans-serif; padding:6px 11px; border-radius:6px; border:1px solid var(--line); background:var(--surface-2); color:var(--ink-2); cursor:pointer}
.sec[aria-pressed="true"]{border-color:var(--signal); background:var(--signal-soft); color:var(--ink)}
.sec .n{font-family:"JetBrains Mono",monospace; font-size:11px; margin-left:5px}
.progress{display:flex; align-items:center; gap:10px; margin:0 0 12px; font-family:"JetBrains Mono",monospace; font-size:12px; color:var(--ink-2)}
.progress .track{flex:1; height:4px; background:var(--sunk); border-radius:2px; overflow:hidden}
.progress .fill{height:100%; background:var(--dsl)}
.nav{display:flex; gap:8px; justify-content:space-between; margin:-6px 0 22px}
.queue{background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.queue h3{margin:0; padding:14px 18px 10px; font-family:"JetBrains Mono",monospace; font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-3); font-weight:400}
.row{display:flex; gap:10px; align-items:center; width:100%; text-align:left; padding:12px 18px; border:0; border-top:1px solid var(--line); background:var(--surface); color:var(--ink); font:inherit; cursor:pointer}
.row:hover{background:var(--surface-2)}
.row .t{flex:1; min-width:0; font-weight:600; font-size:15px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.row .k{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3); flex:none}
.row.done .t{color:var(--ink-3); text-decoration:line-through; font-weight:400}
.issue{margin:0 0 14px; padding:12px 14px; border-radius:8px; background:var(--tpl-soft); color:var(--ink); border:1px solid var(--tpl); max-width:68ch}
.issue .h{display:flex; gap:8px; align-items:baseline; flex-wrap:wrap}
.issue .num{font-family:"JetBrains Mono",monospace; font-weight:700; color:var(--tpl); font-size:13px}
.issue .ti{font-family:"JetBrains Mono",monospace; font-size:11.5px; color:var(--ink-2); word-break:break-word}
.issue p{margin:6px 0 0; font-size:15px}
.issue a{display:inline-block; margin-top:6px; color:var(--tpl); font-weight:600; font-size:14px}
.rel{margin:0 24px 16px; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.rel .row{padding:10px 14px}
.rel .row:first-child{border-top:0}
@media (max-width:560px){ .rel{margin-left:16px;margin-right:16px} .row{padding-left:14px;padding-right:14px} }

/* v3: numeric scales, gif/video gallery, compare wipe, A/B player, time marks */
.seg-row{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.scale-lbl{font-family:"JetBrains Mono",monospace; font-size:11px; color:var(--ink-3)}
.scale-range-wrap{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.scale-range-wrap input[type=range]{flex:1; min-width:120px}
.scale-val{min-width:2.5em; text-align:right}

.cmp-mode{display:flex; gap:6px; margin:0 0 4px}
.wipe{position:relative; overflow:hidden; background:var(--sunk); border-radius:4px; aspect-ratio:16/10; touch-action:none}
.wipe-ref, .wipe-cand{position:absolute; inset:0; width:100%; height:100%; object-fit:contain; pointer-events:none}
.wipe-line{position:absolute; top:0; bottom:0; width:2px; background:#fff; box-shadow:0 0 0 1px rgba(0,0,0,.35); transform:translateX(-1px)}
.wipe-range{position:absolute; inset:0; width:100%; height:100%; opacity:0; margin:0; cursor:ew-resize}

.ab{display:grid; gap:10px; padding:10px 24px 6px}
.ab-stage video{display:block; width:100%; max-height:60vh; border-radius:4px; background:#000}
/* Maximise a video in place: same player, so time, marks and A/B state survive. */
.maxed{position:fixed!important; inset:0; z-index:30; margin:0!important; border-radius:0!important; overflow:auto; background:#12151A!important; color:#fff!important; padding:calc(env(safe-area-inset-top,0px) + 10px) 12px calc(env(safe-area-inset-bottom,0px) + 10px)!important}
.maxed figcaption, .maxed .mono, .maxed .ab-letter{color:#fff}
.maxed video{max-height:calc(100vh - 150px)!important; height:calc(100vh - 150px); width:100%; object-fit:contain}
.maxed .ab-stage video{max-height:calc(100vh - 210px)!important; height:calc(100vh - 210px)}
.max-btn{margin-top:8px}
.ab-switch{display:flex; flex-wrap:wrap; gap:6px; max-width:100%}
.ab-transport{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.ab-transport input[type=range]{flex:1; min-width:120px}
.ab-rate-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:4px}
.ab-letter{font-family:"JetBrains Mono",monospace; font-weight:700; min-width:1.2em}

.marks{margin-top:8px; display:grid; gap:6px}
.marks-actions{display:flex; gap:8px; flex-wrap:wrap}
.marks-list{list-style:none; margin:0; padding:0 4px 0 0; display:grid; gap:6px; max-height:40vh; overflow-y:auto; overscroll-behavior:contain}   /* the player stays in view while marks scroll */
.mark-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.mark-time{font:600 13px "JetBrains Mono",monospace; padding:4px 8px; border-radius:6px; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); cursor:pointer}
.mark-note{flex:1; min-width:120px; min-height:32px; font-size:14px; padding:4px 8px}
/* Priority filter and sort; priority badge and blocked sessions on the origin line. */
.bar3{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin:-8px 0 18px}
.bar3 .lbl{margin-right:2px}
.bar3 .sep{flex:1}
.prio{font:700 12px "JetBrains Mono",monospace; padding:1px 7px; border-radius:4px; color:#fff; background:var(--ink-3)}
.prio.p0{background:var(--alert)} .prio.p1{background:var(--signal)} .prio.p2{background:var(--tpl)}
.origin .blocks{font-weight:400; font-size:13px; color:var(--alert)}

/* Projects, sessions strip, session detail sheet, session filter. */
#proj{margin:0 0 12px}
#sessf select{max-width:100%; min-width:0}
.ss{margin:0 0 18px; background:var(--surface); color:var(--ink); border:1px solid var(--line); border-radius:10px; overflow:hidden}
.ss-head{display:flex; gap:8px; align-items:center; width:100%; padding:10px 14px; border:0; background:var(--surface); color:var(--ink-2); font:11px "JetBrains Mono",monospace; letter-spacing:.14em; text-transform:uppercase; text-align:left; cursor:pointer}
.ss-head .chev{margin-left:auto}
.ss-proj{display:flex; flex-wrap:wrap; gap:2px 6px; align-items:baseline; width:100%; padding:8px 14px 4px; border:0; border-top:1px solid var(--line); background:var(--surface); color:var(--ink); font:13px Archivo,sans-serif; text-align:left; white-space:nowrap; cursor:pointer}
.ss-proj b{font-weight:700; flex:none}
.ss-proj .goal{order:4; flex:1 1 100%; min-width:0; padding-left:14px; overflow:hidden; text-overflow:ellipsis; color:var(--ink-2)}
.ss-proj .cnt{flex:none; margin-left:auto; font:11px "JetBrains Mono",monospace; color:var(--ink-2)}
.ss-proj .chev{flex:none; color:var(--ink-3)}
/* Phones: name, badges and age on line 1, goal on its own line 2, so neither is starved. Wide: one line, name ≤40%. */
.srow{display:grid; grid-template-columns:10px minmax(0,1fr) auto auto; grid-template-areas:"dot nm bd age" ". dg dg dg"; gap:2px 8px; align-items:center; width:100%; padding:8px 14px; border:0; border-top:1px solid var(--line); background:var(--surface); color:var(--ink); font:14px Archivo,sans-serif; text-align:left; cursor:pointer}
.srow:hover{background:var(--surface-2)}
.srow .sdot{grid-area:dot} .srow .badges{grid-area:bd} .srow .age{grid-area:age} .srow .dg{grid-area:dg}
@media (min-width:560px){ .srow{grid-template-columns:10px fit-content(40%) minmax(0,1fr) auto auto; grid-template-areas:"dot nm dg bd age"; gap:8px} }
.srow .nm{grid-area:nm; min-width:0; font:700 13px "JetBrains Mono",monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.srow .dg{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--ink-2)}
.srow .dg .now{display:none}
@media (min-width:560px){ .srow .dg .now{display:inline; color:var(--ink-3)} }
.srow .badges{display:flex; gap:6px; font:12px "JetBrains Mono",monospace; color:var(--ink-2)}
.srow .badge.hot{color:var(--alert); font-weight:700}
.srow .age{font:11px "JetBrains Mono",monospace; color:var(--ink-3)}
.sdot{width:10px; height:10px; border-radius:50%; border:2px solid var(--ink-3); flex:none}
.sdot.blocked{background:var(--alert); border-color:var(--alert)}
.sdot.waiting{background:var(--signal); border-color:var(--signal)}
.sdot.working{background:var(--tpl); border-color:var(--tpl)}
.ss-more{display:block; width:100%; padding:8px 14px; border:0; border-top:1px solid var(--line); background:var(--surface); color:var(--ink-2); font:13px Archivo,sans-serif; text-align:left; cursor:pointer}
dialog.sheet{box-sizing:border-box; border:0; border-radius:12px; padding:0; width:min(560px, calc(100vw - 32px)); max-width:100vw; max-height:85vh; overflow-x:hidden; background:var(--surface); color:var(--ink)}
dialog.sheet::backdrop{background:rgba(18,21,26,.55)}
.sheet .in{padding:18px 18px 22px; display:grid; grid-template-columns:minmax(0,1fr); gap:12px}
/* Nothing in the sheet may be wider than it: long ids, branch names and unbroken tokens wrap; media and code shrink. */
.sheet .in *{min-width:0; max-width:100%; overflow-wrap:anywhere}
.sheet .in p, .sheet .in li, .sheet .in span{white-space:normal}
.sheet pre{white-space:pre-wrap}
.sheet img, .sheet video, .sheet audio, .sheet canvas, .sheet .md table{max-width:100%}
.sheet .sh-h{display:flex; gap:10px; align-items:center}
.sheet h2{margin:0; font-size:20px; flex:1; min-width:0; overflow-wrap:anywhere}
.sheet .kv p, .sheet .kv ul{margin:2px 0 0; font-size:15px}
.sheet .kv ul{padding-left:1.2em}
.sheet .rel{margin:4px 0 0}
.sheet .notes{list-style:none; padding:0; margin:4px 0 0; display:grid; gap:10px}
.sheet .nt{border:1px solid var(--line); border-radius:8px; padding:10px 12px; display:grid; gap:6px; background:var(--surface-2); min-width:0}
.sheet .nt-sum{display:flex; gap:8px; align-items:center; width:100%; padding:0; border:0; background:none; color:var(--ink); font:inherit; font-size:14px; text-align:left; cursor:pointer}
.sheet .nt-sum .chip, .sheet .nt-sum .note, .sheet .nt-sum .rp{flex:none}
.sheet .nt-sum .pv{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.sheet .nt-sum .rp{font:11px "JetBrains Mono",monospace; color:var(--dsl)}
.sheet .nt.done{opacity:.6}
.sheet .udot{flex:none; width:9px; height:9px; border-radius:50%; background:var(--dsl)}
.sheet .msg{display:grid; gap:6px; min-width:0}
.sheet .msg.done{opacity:.75}
.sheet .msg > .nt-sum{cursor:default}
.sheet .nt-replies{display:grid; gap:10px; margin-left:10px; padding-left:10px; border-left:2px solid var(--line)}
.sheet .nt-reply-box{border-top:1px dashed var(--line); padding-top:8px}
#mark-all{display:block; margin:6px 0}
.srow .badge.rep{color:var(--surface); background:var(--dsl); border-radius:999px; padding:0 6px; font-weight:700}
.sheet .nt p{margin:0}
.sheet .nt-text{white-space:pre-wrap; overflow-wrap:anywhere}
.sheet .nt .agentnote{margin:0}
.sheet audio, .sheet video{display:block; width:100%; max-height:40vh}
.sheet .nt-att{display:grid; gap:4px; justify-items:start}
.sheet textarea{margin-top:4px}
@media (max-width:560px){ dialog.sheet{margin:auto 0 0; width:100%; max-width:100%; border-radius:12px 12px 0 0} }

/* Mark screenshots: capture a frame or upload an image, draw on it, keep a note. */
.mark-shots{display:flex; gap:6px; flex-wrap:wrap; width:100%}
.mark-shot{margin:0; display:grid; gap:2px; max-width:140px}
.mark-shot img{width:140px; height:auto; border-radius:4px; cursor:zoom-in; border:1px solid var(--line)}
.mark-shot figcaption{font-size:12px; color:var(--ink-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.ann{position:fixed; inset:0; z-index:40; background:rgba(18,21,26,.94); color:#fff; display:grid; grid-template-rows:auto 1fr auto; gap:8px; padding:calc(env(safe-area-inset-top,0px) + 10px) 10px calc(env(safe-area-inset-bottom,0px) + 10px)}
.ann-tools, .ann-foot{display:flex; gap:6px; flex-wrap:wrap; align-items:center}
.ann .seg{border-color:#5A6573; background:transparent; color:#fff}
.ann .seg[aria-pressed="true"]{background:#fff; color:#12151A; border-color:#fff}
.ann-stage{min-height:0; display:grid; place-items:center; overflow:auto}
.ann-stage canvas, .ann-stage img{max-width:100%; max-height:100%; touch-action:none; background:#000}
.ann-stage canvas{cursor:crosshair}
.ann-foot textarea{flex:1; min-width:200px; min-height:44px; background:#fff; color:#12151A}
.ann-note{max-width:80ch; white-space:pre-wrap}

@media (max-width:560px){ .ab{padding-left:16px;padding-right:16px} }

/* kind "edit": a text to read, edit in place and send back */
.doc{padding:6px 24px 10px; display:grid; gap:10px}
.doc-bar{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.doc-bar .note{margin-left:auto}
.doc-view{background:var(--surface-2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:16px 18px; font-size:17px; line-height:1.6; overflow-wrap:anywhere}
.doc-view .md p, .doc-view.md p{margin:0 0 12px}
.doc-view .md h3{font-size:21px; margin-top:22px}
.doc-view p.dir{font-size:13.5px; line-height:1.45; color:var(--ink-3); margin:-4px 0 12px 14px; padding-left:10px; border-left:2px solid var(--line)}
.doc-view .src{font-size:11px; color:var(--ink-3); opacity:.7}
.doc-view hr.doc-hr{border:0; border-top:1px solid var(--line); margin:22px 0}
textarea.doc-ed{min-height:3em; resize:none; overflow:hidden; font:17px/1.6 Archivo,sans-serif; padding:8px 10px; margin:0 0 12px; border-color:var(--tpl)}
.doc-p::after{content:""; display:block; clear:both}
.doc-cbtn{float:right; margin:2px 0 4px 10px; font:600 12px Archivo,sans-serif; padding:2px 9px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink-3); cursor:pointer}
.doc-cbtn:hover{color:var(--signal); border-color:var(--signal)}
.doc-note{margin:-6px 0 14px; padding:6px 8px; background:var(--signal-soft); color:var(--ink); border-left:3px solid var(--signal); border-radius:4px; font-size:15px; white-space:pre-wrap}
textarea.doc-ed.doc-note-ta{font:15px/1.45 Archivo,sans-serif; min-height:2.6em; margin:0; padding:6px 8px; border-color:var(--signal); background:var(--surface)}
.doc-view .doc-blk.editable{cursor:text; border-radius:6px; margin:0 -6px; padding:0 6px}
.doc-view .doc-blk.editable:hover, .doc-view .doc-blk.editable:focus-visible{background:var(--tpl-soft)}
@media (max-width:560px){ .doc{padding-left:16px; padding-right:16px} .doc-view{padding:12px 14px} }
</style>

  if (!list.length) return;
  const head = kind === "notify"
    ? `[decision-inbox] ${list.length} answer(s) not sent yet. Read them with ArtifactData (items, status == answered), act, and write resolution {text, at, by} and status processed on each.`
    : `[decision-inbox] Status requested for ${list.length} answer(s) already sent and unresolved. On each, write agent_note {text, at, by} with where it stands, or resolution {text, at, by} and status processed if done.`;
  let body = projLine(list) ? "\n" + projLine(list) : "", shown = 0;
  for (const it of list) {
    const line = `\n- ${it.id}: «${it.title}»${it.source_agent ? " (from " + it.source_agent + ")" : ""}` + (kind === "notify" && answerLine(it) ? " → " + answerLine(it) : "");
    if ((head + body + line).length > 3800) { body += `\n… and ${list.length - shown} more (see the collection).`; break; }
    body += line; shown++;
  }
  bulkNote = {cls:"", msg: t("sending")}; render();
  try {
    const r = await postToClaude($("#sections"), head + body);
    const field = kind === "notify" ? "notified_at" : "status_asked_at", now = new Date().toISOString();
    for (const it of list) { try { await db.doc("items/" + it.id).update({[field]: now}); } catch {} }
    bulkNote = r;
  } catch (e) { bulkNote = {cls:"err", msg: failMsg(e)}; }
  render();
}

document.querySelectorAll(".tab").forEach(b => b.addEventListener("click", () => { filter = b.dataset.f; syncTabs(); render(); }));
$("#sheet").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });   // backdrop tap closes; Esc is native
$("#sheet").addEventListener("close", () => {   // closing the sheet ends a recording (the draft keeps it) and forgets manual expansion
  stopRec(); for (const o of [noteOpen, replyOpen]) for (const k in o) delete o[k];
});

(async () => {
  const claude = window.claude;
  if (!claude?.use) { applyStatic(); $("#live").textContent = t("offline"); $("#list").replaceChildren(el("div", {class:"empty"}, t("no_view"))); return; }
  applyStatic();
  [db, comments] = await Promise.all([claude.use("db"), claude.use("comments").catch(() => null)]);
  claude.use("assets").then(a => { assetsNS = a; if (a) render(); }).catch(() => {});
  if (!db) { $("#live").textContent = t("no_db"); $("#list").replaceChildren(el("div", {class:"empty"}, t("no_db_msg"))); return; }
  const fail = e => { $("#live").textContent = t("disconnected"); const w = $("#warn"); w.hidden = false; w.textContent = t("lost", {code: e?.code || "error"}); };
  db.doc("meta/config").onSnapshot(snap => {
    const c = snap.data() || {};
    if (c.lang) LANG = String(c.lang);
    STRINGS = c.strings && typeof c.strings === "object" ? c.strings : {};
    if (Array.isArray(c.sections) && c.sections.length) { CUSTOM_SECTIONS = c.sections; SEC_RANK = Object.fromEntries(c.sections.map(([k], i) => [k, i])); }
    if (c.repo_url) REPO = c.repo_url;
    PROJECTS = Array.isArray(c.projects) ? c.projects.filter(p => p?.id) : [];
    DEF_PROJ = c.project ? String(c.project) : "";
    applyStatic();
    if (c.project && PROJECTS.length < 2) $("#kicker").textContent = t("kicker_project", {project: PROJECTS.find(p => p.id === c.project)?.label || c.project});
    applyFilters();
  }, fail);
  db.collection("issues").onSnapshot(snap => { issues = Object.fromEntries(snap.docs.map(d => [d.id, d.data()])); render(); }, fail);
  db.collection("items").onSnapshot(snap => {
    allItems = snap.docs.map(d => ({...d.data(), id: d.id}));
    if (seedSeen) { seedSeen = false; markSeen(allItems.filter(i => Date.now() - lastAgentAt(i) > 48 * 3600e3)); }
    $("#live").textContent = t("live", {time: new Date().toLocaleTimeString(LANG, {hour:"2-digit", minute:"2-digit"})});
    applyFilters();
  }, fail);
  db.collection("sessions").onSnapshot(snap => { sessions = snap.docs.map(d => ({...d.data(), id: d.id})).filter(s => s.name); applyFilters(); }, fail);
  db.collection("notes").onSnapshot(snap => { notesAll = snap.docs.map(d => ({...d.data(), id: d.id})); renderSessions(); if ($("#sheet").open) fillSheet(); }, fail);
  setInterval(renderSessions, 60e3);   // ages and staleness move with the clock, not only with writes
})();
</script>
